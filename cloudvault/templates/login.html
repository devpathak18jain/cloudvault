{% extends "base.html" %}{% block title %}Log in - CloudVault{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Welcome back</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username <input name="username" required autofocus autocomplete="username"></label>
    <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">No account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
</section>
{% endblock %}

{% extends "base.html" %}{% block title %}Register - CloudVault{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create your account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username <input name="username" required minlength="3" maxlength="30" autocomplete="username"></label>
    <label>Password (min 8 characters) <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn" type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}

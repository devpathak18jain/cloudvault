<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CloudVault{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('files.index') }}"><span class="logo">&#9729;</span> CloudVault</a>
  {% if g.user %}
  <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <span class="who">{{ g.user.username }}</span>
    <button class="btn ghost" type="submit">Log out</button>
  </form>
  {% endif %}
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>CloudVault &middot; Cloud Computing mini project</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

{% extends "base.html" %}{% block title %}Shared file - CloudVault{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ f.original_name }}</h1>
  <p class="muted">{{ f.size|human_size }} &middot; shared by {{ f.username }}</p>
  <a class="btn" href="{{ url_for('files.shared_download', token=token) }}">Download</a>
</section>
{% endblock %}
